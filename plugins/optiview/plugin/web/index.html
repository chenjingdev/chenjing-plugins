<!doctype html>
<html lang="ko" data-theme="auto">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <meta name="optiview-token" content="%%TOKEN%%">
  <meta name="color-scheme" content="light dark">
  <title>OptiView</title>
  <link rel="icon" href="/web/icon.svg" type="image/svg+xml">
  <link rel="stylesheet" href="/web/style.css">
  <script type="module" src="/web/app.js"></script>
</head>
<body>
  <header class="top">
    <button class="who" id="who" type="button" aria-haspopup="listbox" aria-expanded="false" aria-label="세션 고르기">
      <span class="dot" id="dot" data-state="off"></span>
      <span class="names"><span class="title" id="title">OptiView</span><span class="sub" id="sub"></span></span>
      <span class="caret" aria-hidden="true"></span>
    </button>
    <button class="follow" id="follow" type="button" hidden>따라가기</button>
  </header>
  <div class="menu" id="menu" hidden>
    <div class="menu-list" id="menu-list" role="listbox" aria-label="세션"></div>
    <div class="menu-foot"><button id="theme" type="button">테마</button></div>
  </div>
  <div class="note" id="note" role="status" hidden></div>
  <main id="main" tabindex="-1">
    <div id="page"></div>
  </main>
  <nav class="nav" id="nav" aria-label="답 넘기기" hidden>
    <button id="prev" type="button" aria-label="이전 답">‹</button>
    <span id="pos" aria-live="polite"></span>
    <button id="next" type="button" aria-label="다음 답">›</button>
    <button id="latest" class="latest" type="button" hidden>최신 답</button>
    <span class="grow"></span>
    <button id="copy" class="copy" type="button" title="이 답을 복사">복사</button>
  </nav>
</body>
</html>
